  - path: docs/screenshots/cs/overview.webp
    alt:
      cs: "Přehled: forecast tohoto měsíce, co je na cestě a po splatnosti, otevřená pipeline podle fáze"
      en: "The overview: this month's forecast, what is on the way and overdue, the open pipeline by stage"
  - path: docs/screenshots/cs/deals.webp
    alt:
      cs: Všechny obchodní případy s dlaždicemi, filtry a fázemi jako barevnými štítky
      en: All deals with tiles, filters and the stages as tinted pills
  - path: docs/screenshots/cs/deal.webp
    alt:
      cs: Vyhraný případ s plánem plateb a schválenou nabídkou
      en: A won deal with its payment plan and approved quote
  - path: docs/screenshots/cs/quote.webp
    alt:
      cs: Editor cenové nabídky se souhrnem a DPH
      en: The quote editor with its summary and VAT
  - path: docs/screenshots/cs/forecast.webp
    alt:
      cs: Forecast plánu plateb jako sloupcový graf po měsících a kvartálech
      en: The forecast of payment plans as a column chart by month and quarter
  - path: docs/screenshots/cs/stats.webp
    alt:
      cs: Statistiky se srovnáním s předchozím obdobím a žebříčkem obchodníků
      en: Statistics against the previous period with the salesperson leaderboard
