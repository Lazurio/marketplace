# Deals, a template of the Marketplace, published by
# LazurioTemplates. Release 0.1.0 was published on 2026-11-25 as the annotated
# tag v0.1.0; 0.2.0 (quotes, payment-plan forecast, statistics) on
# 2026-11-26 as v0.2.0; 0.3.0 (a quieter, denser look and UX fixes, the same
# data) on 2026-11-28 as v0.3.0. Its Czech name (Obchodní případy) and screens with a
# locale wait for the Lazurio release that reads them (v0.1.21,
# LazurioPlatform#908), as
# for the other offers; until then one name and the Czech set without a locale.
schemaVersion: lazurio.marketplace.offer.v1
id: deals
section: app-templates
title: Deals
module: deals
repository: LazurioTemplates/deals
publisher: LazurioTemplates
license: MIT
stone: deal
pricing: free
summary:
  cs: "Obchodní případy ve vašich fázích, cenové nabídky s ceníkem, forecast jako plán plateb vyhraných případů a statistiky po obchodnících."
  en: "Deals in your stages, quotes with a price list, a forecast that is the payment plan of won deals, and statistics by salesperson."
features:
  - title:
      cs: Pipeline podle vás
      en: Your own pipeline
    text:
      cs: Fáze, typy zakázek a obchodníky nastavíte sami. Případy vidíte v seznamu s vlastními sloupci nebo na boardu, kde je přetáhnete do jiné fáze. Firmy doplníte z ARES a data převezmete z CSV, i z exportu jiného CRM.
      en: You set the stages, the deal types and the salespeople. Deals show in a list with your own columns or on a board where you drag them to another stage. Companies are filled in from ARES, and data comes in from a CSV, an export of another CRM included.
  - title:
      cs: Cenové nabídky
      en: Quotes
    text:
      cs: Nabídka k případu se sekcemi, položkami z ceníku, slevami, DPH, přenesenou daňovou povinností a rezervou na změny. Má revize a stavy, tiskne se jako PDF a hodnota případu se řídí hlavní nabídkou.
      en: A quote of a deal with sections, lines from the price list, discounts, VAT, reverse charge and a reserve for changes. It has revisions and statuses, prints as a PDF, and the deal's value follows its primary quote.
  - title:
      cs: Forecast a statistiky
      en: Forecast and statistics
    text:
      cs: Vyhraný případ rozdělíte na platby po měsících; sloupcový graf forecastu ukazuje, co je zaplacené, vyfakturované, po splatnosti a jen plánované, po obchodnících, typech zakázek a fakturačních firmách. Statistiky srovnávají období s předchozím.
      en: A won deal is split into payments by month; the forecast's column chart shows what is paid, invoiced, overdue and only planned, by salesperson, deal type and billing entity. The statistics compare a period with the one before.
  - title:
      cs: Práce s agentem
      en: Work with your agent
    text:
      cs: Agent založí případ ze zprávy, připraví nabídku z ceníku, týdenní přehled a uzavře případ s plánem plateb. Každá změna je nejdřív koncept; zveřejní se jen to, co jste viděli a schválili.
      en: Your agent creates a deal from a message, prepares a quote from the price list and the week's review, and closes a deal with its payment plan. Every change is a draft first; only what you saw and approved is published.
seeds:
  empty:
    label:
      cs: Bez případů
      en: No deals
    brief:
      cs: prázdnými daty a výchozím nastavením fází (ukázkové firmy, kontakty a případy nepřenášej)
      en: empty data and the default stages (do not carry the example companies, contacts and deals over)
  sample:
    label:
      cs: S ukázkovými případy
      en: With example deals
    brief:
      cs: ukázkovými obchodníky, firmami, kontakty, případy, aktivitami, ceníkem, nabídkami a plány plateb z vydání v mém jazyce
      en: the example salespeople, companies, contacts, deals, activities, price list, quotes and payment plans from the release, in my language
