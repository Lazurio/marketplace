# Mission Control, the first template of the Marketplace (plan DEV-6593). Its source
# moved from Lazurio/mission-control to LazurioTemplates (decided 2026-11-03).
# Release 4.0.0 was published on 2026-11-03, 4.1.0 on 2026-11-08 and 4.1.1 on
# 2026-11-09, each as an annotated tag. The card follows 4.1.1; its screens per
# language wait for the Lazurio release that reads locale (v0.1.21,
# LazurioPlatform#908), until then the Czech set without one.
schemaVersion: lazurio.marketplace.offer.v1
id: mission-control
section: app-templates
title: Mission Control
module: mission-control
repository: LazurioTemplates/mission-control
publisher: LazurioTemplates
license: MIT
stone: control
pricing: free
summary:
  cs: "Plánujte práci lidí a agentů na jednom místě: plány s cílem a kritérii přijetí, roadmapy v čase a změny, které schválíte jedním krokem."
  en: "Plan the work of people and agents in one place: plans with a goal and acceptance criteria, roadmaps over time, and changes you approve in one step."
features:
  - title:
      cs: Plány s cílem
      en: Plans with a goal
    text:
      cs: Každý plán říká, co se má změnit a proč, pro koho a podle jakých kritérií přijetí poznáte, že je hotovo. Lidé i agenti pracují podle stejného zadání.
      en: Every plan says what should change and why, for whom, and by which acceptance criteria you know it is done, so people and agents work from the same brief.
  - title:
      cs: Roadmapy a kdo na čem pracuje
      en: Roadmaps and who works on what
    text:
      cs: Roadmapy řadí plány do kroků v čase a ukazují, co může začít teď. Plán má vlastníka, úkoly mají řešitele a u roadmapy vidíte, kteří agenti práci dělají a kdo ji kontroluje.
      en: Roadmaps order plans into steps over time and show what can start now. Plans have owners, tasks have assignees, and each roadmap names the agents doing the work and who reviews it.
  - title:
      cs: Koncept a publikace
      en: Draft and publish
    text:
      cs: Každá úprava je nejdřív koncept. Změněné záznamy zkontrolujete srozumitelně popsané a publikujete je jako jednu změnu, nebo je vrátíte. Data zůstávají v repozitáři vaší Organizace.
      en: Every edit is a draft first. You review the changed records in plain words and publish them as one change, or return them. The data stays in your Organization's repository.
seeds:
  empty:
    label:
      cs: Bez plánů
      en: No plans
    brief:
      cs: prázdnými daty (ukázkové plány nepřenášej)
      en: empty data (do not carry the example plans over)
  sample:
    label:
      cs: S ukázkovými plány
      en: With example plans
    brief:
      cs: ukázkovými plány z vydání v mém jazyce
      en: the example plans from the release, in my language
screenshots:
  - path: docs/screenshots/cs/mission-control-overview.webp
    alt:
      cs: "Přehled: k čemu Mission Control je, plány podle stavu, hlavní roadmapa a její další kroky"
      en: "The overview: what Mission Control is for, plans by state, the main roadmap and its next steps"
  - path: docs/screenshots/cs/mission-control-roadmap.webp
    alt:
      cs: Roadmapa s prioritami, s tím, kdo na ní pracuje, a s kroky podle období
      en: A roadmap with its priorities, who works on it and its steps grouped by period
  - path: docs/screenshots/cs/mission-control-plan.webp
    alt:
      cs: Detail plánu s kontextem, cílovým stavem, rozsahem a roadmapami, na kterých je
      en: A plan's detail with its context, target state, scope and the roadmaps it is on
  - path: docs/screenshots/cs/mission-control-draft.webp
    alt:
      cs: Koncept se změněnými záznamy před publikací
      en: A draft with the changed records before publishing
