# Presentations, the pilot offer Lazurio carried in its own code (plan DEV-6593),
# the third template of the Marketplace. It moved from TemplatesRozjedeme-ai with a
# clean history and is published by LazurioTemplates (decided 2026-11-03).
# Release 0.1.0 was published on 2026-11-03, 0.1.1 on 2026-11-08 and 0.2.0 on
# 2026-11-10, each as an annotated tag. The card follows 0.2.0; its screens per
# language wait for the Lazurio release that reads locale (v0.1.21,
# LazurioPlatform#908), until then the Czech set without one.
schemaVersion: lazurio.marketplace.offer.v1
id: presentations
section: app-templates
title: Presentations
module: presentations
repository: LazurioTemplates/presentations
publisher: LazurioTemplates
license: MIT
stone: presentation
pricing: free
summary:
  cs: Prezentace, které tvoříte se svým agentem z vlastních podkladů, česky i anglicky.
  en: Presentations you create with your agent from your own sources, in Czech and English.
features:
  - title:
      cs: Slidy ze zdroje
      en: Slides from a source
    text:
      cs: Agent napíše prezentaci z vašich podkladů jako krátký strukturovaný soubor a jeden příkaz z něj sestaví slidy. Jedenáct typů slidů od titulního přes metriky s grafem po závěrečný.
      en: Your agent writes a presentation from your sources as a short structured file, and one command builds the slides. Eleven slide types, from the title through metrics with a chart to the closing.
  - title:
      cs: Promítání, video a PDF
      en: Presenting, video and PDF
    text:
      cs: Slidy promítáte v prohlížeči na celou obrazovku a listujete šipkami nebo přejetím. Videa jsou místní soubory se zvukem jen na tlačítko; do PDF vytisknete stránku 16:9 na každý slide.
      en: Present the slides full screen in the browser and move through them with the arrow keys or a swipe. Videos are local files with sound only on their button; print one 16:9 PDF page per slide.
  - title:
      cs: Osobní verze pro zájemce
      en: A personal version for each prospect
    text:
      cs: Odkaz se jménem zájemce a jeho organizace ukáže na titulním a závěrečném slidu „Připraveno pro …“. Nic se neukládá; odkaz sestavíte v detailu prezentace.
      en: A link with the prospect's name and organization shows “Prepared for …” on the title and closing slides. Nothing is stored; the presentation's detail builds the link.
