# Design System, the second template of the Marketplace (plan DEV-6593), published by
# LazurioTemplates with a clean history (decided 2026-11-03). Release 1.0.0 was
# published on 2026-11-03 and 2.0.0 on 2026-11-09, each as an annotated tag. The
# card follows 2.0.0; its screens per language wait for the Lazurio release that
# reads locale (v0.1.21, LazurioPlatform#908), until then the Czech set without one.
schemaVersion: lazurio.marketplace.offer.v1
id: design-system
section: app-templates
title: Design System
module: design-system
repository: LazurioTemplates/design-system
publisher: LazurioTemplates
license: MIT
stone: palette
pricing: free
summary:
  cs: Barvy, písmo, komponenty a pravidla vaší Organizace na jednom místě, pro Astro i React, česky i anglicky.
  en: Your Organization's colours, type, components and rules in one place, for Astro and React, in Czech and English.
features:
  - title:
      cs: Značka a tokeny
      en: Brand and tokens
    text:
      cs: Celá značka na jednom místě, paleta, písma, logo a ilustrace. Z ní vznikají barevné role pro světlý i tmavý režim a testy hlídají, že dvojice barev mají kontrast podle WCAG.
      en: The whole brand in one place, its palette, fonts, logo and illustrations. It gives the colour roles for light and dark mode, and tests check that colour pairs reach WCAG contrast.
  - title:
      cs: Komponenty pro Astro i React
      en: Components for Astro and React
    text:
      cs: Tlačítka, formulářové prvky, tabulky, dialogy, karty, navigace a další komponenty se stejnými vlastnostmi v Astru i Reactu. U každé je ukázka v obou režimech, stavy, použití a kód.
      en: Buttons, form fields, tables, dialogs, cards, navigation and more, with the same props in Astro and React. Each has an example in both modes, its states, its use and its code.
  - title:
      cs: Jeden zdroj pro lidi i agenty
      en: One source for people and agents
    text:
      cs: Agent ani kolega nevymýšlí barvy a rozvržení znovu, řídí se pravidly design systému. Další moduly přidají design system jako balíček na vydané verzi.
      en: Neither your agent nor a colleague invents colours and layouts again; they follow the rules of the design system. Other modules add the design system as a package at a released version.
