# The design system with an invented brand, Example: the second template of
# the Marketplace (order decided 2026-11-03), published by LazurioTemplates
# with a fresh history from LazurioExampleOrganization/design-system#7.
# Release 1.0.0 stays generation app/v1 on the stack profile content and is
# prepared in LazurioTemplates/design-system#1; the repository is private and
# not tagged yet, so the commit stays null and Lazurio does not show the offer.
schemaVersion: lazurio.marketplace.offer.v1
id: design-system
section: app-templates
title: Design System
module: design-system
repository: LazurioTemplates/design-system
publisher: LazurioTemplates
license: MIT
stone: palette
pricing: free
summary:
  cs: Barvy, písmo, komponenty a pravidla psaní vaší Organizace na jednom místě.
  en: Your Organization's colours, type, components and writing rules in one place.
features:
  - title:
      cs: Základy značky
      en: Brand foundations
    text:
      cs: Barvy, typografie, mezery a hlas značky jako tokeny. Testy hlídají, že dvojice barev, které komponenty používají, mají kontrast WCAG AA ve světlém i tmavém režimu.
      en: Colours, type, spacing and the brand's voice as tokens. Tests make sure the colour pairs the components use reach WCAG AA contrast in light and dark mode.
  - title:
      cs: Komponenty a vzory
      en: Components and patterns
    text:
      cs: Tlačítka, formuláře, tabulky, dialogy a další komponenty se stavy a přístupností, a vzory jako validace formulářů nebo nevratné akce.
      en: Buttons, inputs, tables, dialogs and other components with their states and accessibility, and patterns such as form validation and irreversible actions.
  - title:
      cs: Jeden zdroj pro lidi i agenta
      en: One source for people and agents
    text:
      cs: Agent ani kolega nevymýšlí barvy a rozvržení znovu. Web, prezentace, dokumenty i interní nástroje vycházejí ze stejných pravidel.
      en: Neither your agent nor a colleague invents colours and layouts again. The website, presentations, documents and internal tools follow the same rules.
