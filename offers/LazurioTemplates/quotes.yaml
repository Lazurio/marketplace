# Quotes, a template of the Marketplace (plan DEV-6593), published by
# LazurioTemplates. Release 0.1.0 was published on 2026-11-10 as the annotated
# tag v0.1.0. Its Czech name (Cenové nabídky) and screens with a locale wait for
# the Lazurio release that reads them (v0.1.21, LazurioPlatform#908).
schemaVersion: lazurio.marketplace.offer.v1
id: quotes
section: app-templates
title: Quotes
module: quotes
repository: LazurioTemplates/quotes
publisher: LazurioTemplates
license: MIT
stone: deal
pricing: free
summary:
  cs: "Ceník a cenové nabídky pro zákazníky: DPH spočítané na haléř, verze, tisk do PDF a připravený e-mail."
  en: "A price list and quotes for your customers: VAT to the haléř, versions, print to PDF and a ready e-mail."
features:
  - title:
      cs: Ceník a import od dodavatele
      en: Price list and supplier imports
    text:
      cs: Položky s nákupní a prodejní cenou bez DPH, sazbou DPH a historií cen. Ceník dodavatele z CSV projde náhledem nových, změněných a chybných řádků; zapíší se jen ty, které vyberete.
      en: Items with purchase and sale prices without VAT, a VAT rate and a price history. A supplier's CSV price list goes through a preview of new, changed and invalid rows; only the rows you choose are written.
  - title:
      cs: Nabídky s verzemi
      en: Quotes with versions
    text:
      cs: Řádky z ceníku i mimo něj, slevy na řádek i celou nabídku, DPH po sazbách a stavy od konceptu po přijetí. Odeslaná nabídka se už nemění; úprava je nová verze.
      en: Lines from the price list or outside it, discounts per line and on the whole quote, VAT per rate and states from draft to accepted. A quote that went out never changes; an edit is a new version.
  - title:
      cs: Kontrola, tisk a e-mail
      en: Check, print and e-mail
    text:
      cs: Před odesláním nabídka upozorní třeba na chybějící cenu, prošlou platnost nebo nízkou marži. Tiskovou stránku uložíte do PDF a text e-mailu je připravený; odeslat ho je vždy váš krok.
      en: Before sending, a quote points out a missing price, an expired validity or a low margin, for example. You save the print page as PDF and the e-mail text is ready; sending it is always your step.
  - title:
      cs: Práce s agentem
      en: Work with your agent
    text:
      cs: Agent připraví nabídku z poptávky, aktualizuje ceník podle dodavatele a zkontroluje nabídku před odesláním. Každá změna je nejdřív koncept, který publikujete jedním krokem.
      en: Your agent prepares a quote from an inquiry, updates the price list from a supplier's and checks a quote before it goes out. Every change is a draft first, which you publish in one step.
