section: app-templates
title: Website
module: website
repository: LazurioTemplates/website
publisher: LazurioTemplates
license: MIT
stone: website
pricing: free
summary:
  cs: "Web vaší firmy: stránky, služby, aktuality a kontakty, které upravujete vy i váš agent."
  en: "Your company's website: pages, services, news and contacts that you and your agent edit."
features:
  - title:
      cs: Stránky, služby, aktuality
      en: Pages, services, news
    text:
      cs: Úvodní stránka, služby s cenami, aktuality a kontakty. Obsah leží v souborech, které upravíte bez programování.
      en: A home page, services with prices, news and contacts. The content lies in files you change without programming.
  - title:
      cs: Úpravy s agentem
      en: Edited with your agent
    text:
      cs: Napište ‚oprav tuhle větu‘ nebo ‚napiš aktualitu‘. Agent ví, kde text leží, ukáže výsledek v prohlížeči a připraví změnu ke schválení.
      en: Write ‘fix this sentence’ or ‘write a news item’. Your agent knows where the text lies, shows the result in a browser and prepares the change for your approval.
  - title:
      cs: Rychlý a dohledatelný
      en: Fast and findable
    text:
      cs: Statické stránky, popisy pro vyhledávače a náhledy odkazů, mapa webu, přístupnost a vzhled z vašeho Design Systemu.
      en: Static pages, descriptions for search engines and link previews, a sitemap, accessibility and the look of your Design System.
seeds:
  empty:
    label:
      cs: Vlastním obsahem
      en: Your own content
    brief:
      cs: vlastním obsahem mé Organizace (ukázkový web firmy Example nepřenášej)
      en: my Organization's own content (do not carry the Example website over)
  sample:
    label:
      cs: Ukázkovým webem
      en: The example website
    brief:
