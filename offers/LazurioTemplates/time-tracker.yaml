  - path: docs/screenshots/cs/time-tracker-today.webp
    alt:
      cs: "Dnes: běžící časovač, ruční zápis času a záznamy týdne"
      en: "Today: the running timer, time written by hand and the week's entries"
  - path: docs/screenshots/cs/time-tracker-overview.webp
    alt:
      cs: "Přehled týdne: hodiny celkem a k fakturaci, hodiny po dnech a dny bez záznamu"
      en: "The week's overview: hours in total and to invoice, hours by day and the days without entries"
  - path: docs/screenshots/cs/time-tracker-entries.webp
    alt:
