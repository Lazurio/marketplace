# Time Tracker, a template of the Marketplace (plan DEV-6593), published by
# LazurioTemplates. Release 0.1.0 was published on 2026-11-09 as the annotated
# tag v0.1.0. Its Czech name (Evidence času) and screens with a locale wait for
# the Lazurio release that reads them (v0.1.21, LazurioPlatform#908).
schemaVersion: lazurio.marketplace.offer.v1
id: time-tracker
section: app-templates
title: Time Tracker
module: time-tracker
repository: LazurioTemplates/time-tracker
publisher: LazurioTemplates
license: MIT
stone: profitability
pricing: free
summary:
  cs: "Odpracovaný čas na projektech: časovače, ruční záznamy, přehled týdne a měsíce a export pro fakturaci."
  en: "Time worked on projects: timers, time written by hand, week and month overviews and exports for invoicing."
features:
  - title:
      cs: Časovač i ruční zápis
      en: Timer and time by hand
    text:
      cs: Spustíte a zastavíte svůj časovač, nebo zapíšete den, začátek a konec. Uživatel mění své záznamy, správce aplikace i záznamy ostatních; zapomenutý časovač se po deseti hodinách zastaví sám.
      en: Start and stop your timer, or write a day, a start and an end. A user changes their own entries, the App's administrator everyone's; a forgotten timer stops by itself after ten hours.
  - title:
      cs: Přehled týdne a měsíce
      en: Week and month overview
    text:
      cs: Hodiny celkem a k fakturaci po dnech, projektech, klientech a lidech, i pracovní dny, kdy nikdo nic nezapsal.
      en: Hours in total and to invoice by day, project, client and person, and the working days nobody recorded.
  - title:
      cs: Export pro fakturaci a mzdy
      en: Export for invoicing and payroll
    text:
      cs: Záznamy i souhrn hodin podle klienta, projektu a člověka jako CSV, které tabulkový procesor otevře hned.
      en: Entries and hours by client, project and person as a CSV your spreadsheet opens as it is.
seeds:
  empty:
    label:
      cs: Bez záznamů
      en: No entries
    brief:
      cs: prázdnými daty (ukázkové klienty, projekty a záznamy nepřenášej)
      en: empty data (do not carry the example clients, projects and entries over)
  sample:
    label:
      cs: S ukázkovými záznamy
      en: With example entries
    brief:
      cs: ukázkovými klienty, projekty a záznamy z vydání v jazyce Organizace
      en: the example clients, projects and entries of the release in the Organization's language
