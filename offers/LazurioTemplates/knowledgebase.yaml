      cs: Postup s jeho údaji (platí, kdo odpovídá, kdy byl ověřen, zdroje) a navigací oddílů
      en: A procedure with its details (valid, owner, last confirmed, sources) and the navigation of the sections
  - path: docs/screenshots/cs/home.webp
    alt:
      cs: Úvodní stránka s oddíly a s tím, jak hledat a jak něco přidat
      en: The home page with the sections, how to search and how to add something
  - path: docs/screenshots/cs/agent-procedure-outline.webp
    alt:
      cs: Oddíl Postupy pro agenty s osnovou stránky
      en: The section Procedures for agents with the outline of a page
  - path: docs/screenshots/cs/decision.webp
    alt:
      cs: Číslované rozhodnutí s tím, kdo a kdy rozhodl, souvislostmi a důsledky
      en: A numbered decision with who decided and when, its context and its consequences
  - path: docs/screenshots/cs/glossary-dark.webp
    alt:
      cs: Pojem ve slovníku s jeho jinými názvy, v tmavém režimu
      en: A glossary term with its other names, in dark mode
  - path: docs/screenshots/cs/search.webp
    alt:
      cs: Hledání, které najde pojem i podle jeho jiného názvu
      en: Search that finds a term by its other name too
