module: knowledgebase
repository: LazurioTemplates/knowledgebase
publisher: LazurioTemplates
license: MIT
stone: knowledge
pricing: free
summary:
  cs: Postupy, znalosti, slovník a rozhodnutí vaší Organizace na jednom místě, pro lidi i agenty.
  en: Your Organization's procedures, knowledge, glossary and decisions in one place, for people and agents.
features:
  - title:
      cs: Postupy, slovník a rozhodnutí
      en: Procedures, glossary and decisions
    text:
      cs: Oddíly O Organizaci, Lidé a role, Procesy a postupy, Postupy pro agenty, Slovník a Rozhodnutí. Každý oddíl má přehled s tím, co do něj patří, a osnovou stránky.
      en: Sections About the Organization, People and roles, Processes and procedures, Procedures for agents, Glossary and Decisions. Each has an overview with what belongs there and the outline of a page.
  - title:
      cs: Agent hledá, než odpoví
      en: Your agent searches before it answers
    text:
      cs: Než agent odpoví, jak to ve vaší Organizaci chodí, hledá v Knowledgebase a uvede stránku. Na ‚zapiš postup‘, ‚zapiš rozhodnutí‘ nebo ‚doplň slovník‘ připraví stránku podle osnovy a dá vám ji ke kontrole.
      en: Before your agent answers how your Organization works, it searches the knowledge base and names the page. Asked to write a procedure, record a decision or add a term, it drafts the page from the outline for your review.
  - title:
      cs: Ověřené a snadno k nalezení
      en: Trusted and easy to find
    text:
      cs: U každé stránky vidíte, jestli platí, kdo za ni odpovídá a kdy byla naposledy ověřena. Hledání projde všechny stránky včetně jiných názvů pojmů; vzhled dává design system vaší Organizace.
      en: Every page shows whether it is valid, who keeps it true and when it was last confirmed. Search covers every page, including the other names of terms; the look comes from your Organization's design system.
seeds:
  empty:
    label:
      cs: Prázdnou, jen strukturou
      en: Empty, structure only
    brief:
      cs: prázdnou Knowledgebase jen se strukturou oddílů (ukázku Example nepřenášej)
      en: an empty knowledge base with the structure of its sections only (do not carry the Example sample over)
  sample:
    label:
      cs: S ukázkou Example
      en: With the Example sample
    brief:
      cs: ukázkou vymyšlené Organizace Example z vydání
      en: the sample of the invented Organization Example from the release
