# Presentations, the pilot offer Lazurio has carried in its own code
# (LazurioPlatform src/launchpad/marketplace.ts, plan DEV-6593). The template
# moves from TemplatesRozjedeme-ai/Presentations to LazurioExampleOrganization
# with a clean history (decided 2026-11-03); the new repository does not exist
# yet. Release 0.1.0 was never published, so the commit stays null and the
# offer cannot be adopted. The screens Lazurio bundles today move into the
# template's repository with the release and are listed here then.
