# Presentations, the pilot offer Lazurio carried in its own code
# (LazurioPlatform src/launchpad/marketplace.ts, plan DEV-6593), the third
# template of the Marketplace. It moved to LazurioExampleOrganization with a
# clean history (decided 2026-11-03). Release 0.1.0 is prepared in
# LazurioExampleOrganization/presentations#1; it is not tagged yet, so the
# commit stays null and Lazurio does not show the offer.
schemaVersion: lazurio.marketplace.offer.v1
id: presentations
section: app-templates
title: Presentations
module: presentations
repository: LazurioExampleOrganization/presentations
publisher: LazurioExampleOrganization
license: MIT
stone: presentation
pricing: free
summary:
  cs: Knihovna prezentací, které tvoříte se svým agentem.
  en: A library of presentations you create with your agent.
features:
  - title:
      cs: Knihovna
      en: Library
    text:
      cs: Všechny prezentace na jednom místě, u každé náhled prvního slidu a podklady, ze kterých vznikla.
      en: Every presentation in one place, with a preview of its first slide and the sources it was built from.
  - title:
      cs: Promítání a PDF
      en: Presenting and PDF
    text:
      cs: Slidy promítáte v prohlížeči a listujete jimi šipkami. Do PDF je vytisknete ve formátu 16:9.
      en: Present the slides in the browser and move through them with the arrow keys. Print them to 16:9 PDF pages.
  - title:
      cs: Tvorba s agentem
      en: Created with your agent
    text:
      cs: Řekněte agentovi, komu je prezentace určená a z čeho má vycházet. Navrhne osnovu, připraví slidy z podkladů vaší Organizace a dá vám je ke kontrole.
      en: Tell the agent who the presentation is for and what it should draw on. It proposes an outline, drafts the slides from your Organization's sources and hands them to you for review.
seeds:
  empty:
    label:
      cs: Prázdnou knihovnou
      en: An empty library
    brief:
      cs: prázdnou knihovnou (ukázkovou prezentaci nepřenášej)
      en: an empty library (do not carry the example presentation over)
  sample:
    label:
      cs: Ukázkovou prezentací
      en: An example presentation
    brief:
      cs: ukázkovou prezentací z vydání
      en: the example presentation from the release
screenshots:
  - path: docs/screenshots/library.webp
    alt:
      cs: Knihovna s náhledem prvního slidu ukázkové prezentace
      en: The library with the first-slide preview of the example presentation
  - path: docs/screenshots/detail.webp
    alt:
      cs: Detail prezentace s jejím účelem a podklady
      en: A presentation's detail with its purpose and sources
  - path: docs/screenshots/agent-brief.webp
    alt:
      cs: Zadání pro agenta k nové prezentaci
      en: The brief for your agent to create a presentation
  - path: docs/screenshots/slide.webp
    alt:
      cs: Slide ukázkové prezentace při promítání
      en: A slide of the example presentation while presenting
releases:
  - version: 0.1.0
    tag: v0.1.0
    generation: app/v1
    stack: vite-react
    bun: 1.4.4
    commit: null
    artifactDigest: null
